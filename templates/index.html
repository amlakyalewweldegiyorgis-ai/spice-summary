<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spice Summary</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-4xl w-full p-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">🌶️ Spice Summary</h1>
        
        <div class="grid md:grid-cols-2 gap-4">
            <!-- URL Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">URL</label>
                <input type="url" id="urlInput" placeholder="https://example.com/article" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <!-- Raw Text Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Raw Text</label>
                <textarea id="textInput" rows="3" placeholder="Paste text here..." class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
            </div>
        </div>

        <button id="submitBtn" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">Summarize</button>

        <div id="loading" class="hidden mt-4 text-blue-600 text-center">⏳ Processing...</div>

        <div id="result" class="mt-6 space-y-3"></div>
    </div>

    <script>
        const submitBtn = document.getElementById('submitBtn');
        const urlInput = document.getElementById('urlInput');
        const textInput = document.getElementById('textInput');
        const resultDiv = document.getElementById('result');
        const loading = document.getElementById('loading');

        submitBtn.onclick = async () => {
            const url = urlInput.value.trim();
            const text = textInput.value.trim();

            if (!url && !text) {
                resultDiv.innerHTML = `<div class="bg-red-100 text-red-700 p-3 rounded-lg">❌ Please enter a URL or paste text.</div>`;
                return;
            }

            loading.classList.remove('hidden');
            resultDiv.innerHTML = '';

            try {
                const res = await fetch('/summarize', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url, text})
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Server error');
                }

                const data = await res.json();
                resultDiv.innerHTML = `
                    <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                        <h3 class="font-semibold text-green-800">📝 Summary</h3>
                        <p class="text-gray-700">${data.summary}</p>
                    </div>
                    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                        <h3 class="font-semibold text-blue-800">💬 Sentiment</h3>
                        <p class="text-gray-700">${data.sentiment}</p>
                    </div>
                    <div class="bg-purple-50 border border-purple-200 rounded-lg p-4">
                        <h3 class="font-semibold text-purple-800">🧠 Conclusion</h3>
                        <p class="text-gray-700">${data.conclusion}</p>
                    </div>
                `;
            } catch (err) {
                resultDiv.innerHTML = `<div class="bg-red-100 text-red-700 p-3 rounded-lg">❌ ${err.message}</div>`;
            } finally {
                loading.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
